name: bill_tracker
description: Track credit card and utility bills across payment apps, with receipt-gated reminders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  path_provider: any
  permission_handler: any
  flutter_local_notifications: any
  timezone: any
  file_picker: any
  open_filex: any
  fl_chart: any
  receive_sharing_intent: any
  home_widget: any
  local_auth: any
  flutter_secure_storage: any
  archive: any
  share_plus: any
  workmanager: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#0E6B57"
  adaptive_icon_foreground: assets/icon_fg.png
